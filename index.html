<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSea Clone</title>

  <!-- Fonte mais próxima da original -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="left">
    <i class="ri-menu-line"></i>

    <div class="logo">
      <div class="circle"></div>
      <span>OpenSea</span>
    </div>
  </div>

  <div class="right">
    <i class="ri-search-line"></i>
    <button class="btn-connect">Connect</button>
  </div>
</header>

<main class="container">

  <div class="collection">

    <img src="./cryptopunks.webp" class="avatar">

    <div class="info">

      <div class="title-row">
        <h1>CryptoPunks</h1>
        <i class="ri-checkbox-circle-fill verified"></i>
        <i class="ri-star-line star"></i>
      </div>

      <div class="icons">
        <i class="ri-information-line"></i>
        <i class="ri-file-copy-line"></i>
        <i class="ri-global-line"></i>
        <i class="ri-twitter-x-line"></i>
        <i class="ri-share-line"></i>
        <i class="ri-more-2-fill"></i>
      </div>

      <div class="tags">
        <span>BY C352B5</span>
        <span><i class="ri-ethereum-fill"></i> ETHEREUM</span>
        <span><i class="ri-stack-fill"></i> 9,994</span>
        <span>JUN 2017</span>
        <span>PFPS</span>
      </div>

    </div>
  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <p>FLOOR PRICE</p>
      <h3>25.99 ETH</h3>
    </div>

    <div class="stat">
      <p>1D FLOOR %</p>
      <h3 class="red">-3.9%</h3>
    </div>

    <div class="stat">
      <p>TOP OFFER</p>
      <h3>–</h3>
    </div>

    <div class="stat">
      <p>24H VOLUME</p>
      <h3>135.55 ETH</h3>
    </div>

    <div class="stat">
      <p>TOTAL VOLUME</p>
      <h3>1.4M ETH</h3>
    </div>

    <div class="stat">
      <p>OWNERS (UNIQUE)</p>
      <h3>3,817 (38.2%)</h3>
    </div>

  </div>

  <!-- MENU -->
  <div class="menu-bottom">
    <span class="active">Explore</span>
    <span>Items</span>
    <span>Holders</span>
    <span>Traits</span>
    <span>Activity</span>
    <span>Analytics</span>
    <span>About</span>
  </div>

</main>

</body>
</html>
